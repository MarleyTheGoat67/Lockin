name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Test planning logic
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  build:
    name: Build unsigned .ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lockin.xcodeproj \
            -scheme Lockin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error|warning: unre|BUILD|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/Lockin.app

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lockin.app Payload/
          zip -qry Lockin.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Lockin-ipa
          path: Lockin.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
